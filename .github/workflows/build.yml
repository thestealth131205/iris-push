name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | grep -oP '"\K[^"]+')
          echo "IRIS_VERSION=${VERSION}" >> $GITHUB_ENV

      # Release-Signing nur moeglich, wenn die Keystore-Secrets im Repo hinterlegt sind
      # (IRIS_KEYSTORE_BASE64/IRIS_KEYSTORE_PASSWORD/IRIS_KEY_ALIAS/IRIS_KEY_PASSWORD).
      # Auf Forks/PRs von aussen fehlen diese Secrets -> Fallback auf unsignierten Debug-Build,
      # damit der Workflow trotzdem gruen bleibt.
      - name: Decode release keystore
        id: keystore
        if: ${{ secrets.IRIS_KEYSTORE_BASE64 != '' }}
        env:
          IRIS_KEYSTORE_BASE64: ${{ secrets.IRIS_KEYSTORE_BASE64 }}
        run: |
          echo "$IRIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iris-release.jks"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (signed)
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          IRIS_KEYSTORE_PATH: ${{ runner.temp }}/iris-release.jks
          IRIS_KEYSTORE_PASSWORD: ${{ secrets.IRIS_KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK (no signing secrets available)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/iris-push-${IRIS_VERSION}.apk"
            echo "APK_PATH=dist/iris-push-${IRIS_VERSION}.apk" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/iris-push-${IRIS_VERSION}-debug.apk"
            echo "APK_PATH=dist/iris-push-${IRIS_VERSION}-debug.apk" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-push-${{ env.IRIS_VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release and upload APK
        if: ${{ github.event_name == 'push' && env.IS_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "v${IRIS_VERSION}" "${APK_PATH}" --clobber 2>/dev/null || \
          gh release create "v${IRIS_VERSION}" \
            --title "Iris Push v${IRIS_VERSION}" \
            --notes "Iris Push Service v${IRIS_VERSION}" \
            "${APK_PATH}"
          echo "GitHub Release v${IRIS_VERSION} aktualisiert"
